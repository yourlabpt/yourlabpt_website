<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Foco comercial</title>
    <link rel="stylesheet" href="./digitalizept.css">
    <link rel="stylesheet" href="./foco.css">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#1b1b1b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="foco-body">
    <div id="login-overlay" class="overlay hidden">
        <div class="login-box">
            <h1>Foco comercial</h1>
            <p>digitalizemeunegocio.pt · YourLab</p>
            <form id="login-form">
                <input type="text" id="user-input" placeholder="Utilizador" autocomplete="username" autocapitalize="none">
                <input type="password" id="key-input" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Entrar</button>
            </form>
            <div id="login-error"></div>
        </div>
    </div>

    <div id="foco" class="foco hidden">
        <header class="foco-header">
            <div>
                <h1>Foco comercial</h1>
                <p id="foco-quem"></p>
            </div>
            <nav class="foco-header-links">
                <a id="foco-admin" class="foco-link hidden" href="./admin.html">Admin</a>
                <a class="foco-link" href="./proposta.html">Proposta</a>
                <button id="foco-sair" type="button" class="foco-link">Sair</button>
            </nav>
        </header>
        <nav class="foco-tabs" role="tablist">
            <button type="button" data-tab="segmentos" class="active">Segmentos</button>
            <button type="button" data-tab="contactos">Contactos</button>
            <button type="button" data-tab="mapa">Mapa</button>
            <button type="button" data-tab="resultados">Resultados</button>
            <button type="button" data-tab="equipa" class="hidden" id="foco-tab-equipa">Equipa</button>
        </nav>
        <main id="foco-main" class="foco-main"></main>
    </div>

    <div id="foco-sheet" class="foco-sheet hidden" role="dialog" aria-modal="true">
        <div class="foco-sheet-backdrop" data-fechar></div>
        <section class="foco-sheet-panel" id="foco-sheet-panel"></section>
    </div>

    <script type="module" src="./js/foco.js"></script>
</body>
</html>
